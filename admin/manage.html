<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PassTrack | Manage</title>
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="manage.css">
</head>
<body>
  <header class="top">
    <strong>PassTrack | Admin</strong>
    <button id="logout">Log out</button>
  </header>
  <main>
    <a class="back" href="index.html">&larr; Back to dashboard</a>
    <h2>Manage accounts and subjects</h2>

    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="students" role="tab">Students</button>
      <button class="tab" data-tab="faculty" role="tab">Faculty</button>
      <button class="tab" data-tab="subjects" role="tab">Subjects</button>
    </nav>

    <section class="panel">
      <h3 id="formTitle"></h3>
      <form id="form" autocomplete="off"></form>
      <p id="msg" class="msg" role="status"></p>
    </section>

    <h3 id="listTitle"></h3>
    <section id="list"></section>
  </main>
  <script src="../shared/session.js"></script>
  <script src="../shared/data.js"></script>
  <script src="../shared/store.js"></script>
  <script src="manage.js"></script>
</body>
</html>
