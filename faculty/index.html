<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PassTrack | Faculty</title>
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <strong>PassTrack | Faculty</strong>
    <button id="logout">Log out</button>
  </header>
  <main>
    <h2 id="name"></h2>
    <label for="subject">Subject</label>
    <select id="subject"></select>
    <p id="meta" class="muted"></p>
    <section id="students"></section>
    <div class="actions">
      <button id="save" class="primary">Save changes</button>
      <button id="reset" class="secondary">Reset demo data</button>
    </div>
    <p id="msg" class="muted" role="status"></p>
  </main>
  <script src="../shared/session.js"></script>
  <script src="../shared/data.js"></script>
  <script src="../shared/store.js"></script>
  <script src="../shared/compute.js"></script>
  <script src="script.js"></script>
</body>
</html>
